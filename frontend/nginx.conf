server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Загруженные в редакторе файлы (EDT-002) отдаёт backend напрямую с диска
    # (app/main.py StaticFiles на /uploads) — не через объектное хранилище/CDN,
    # см. README «Не реализовано».
    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # index.html без Cache-Control кэшируется браузером эвристически — при
    # каждом новом деплое пользователь может продолжать видеть старую
    # версию сколько угодно долго (без нашего "no-cache" полагаться нечем,
    # ETag/If-None-Match не участвуют, пока браузер вообще не считает кэш
    # протухшим). См. аналогичный фикс в проекте turtle — тот же класс
    # проблемы: задание встроено в iframe/страницу, которую пользователь
    # долго не перезагружает, и он мог не увидеть более новую верстку
    # StepIframeTaskView вообще.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # /assets/* у Vite — с хэшем в имени файла, можно кэшировать надолго.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
